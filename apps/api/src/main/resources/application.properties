spring.application.name=konnekt-api
server.port=${PORT:8080}

# Relational data
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/konnekt?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:konnekt}
spring.datasource.password=${DATABASE_PASSWORD:konnekt}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Document data
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/konnekt}
spring.data.mongodb.database=${MONGODB_DATABASE:konnekt}

# Browser clients allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:9000,http://localhost:8080}

# API documentation and health checks
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
