name: konnekt

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-konnekt}
      MYSQL_USER: ${MYSQL_USER:-konnekt}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-konnekt}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-konnekt}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-konnekt}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: ${MYSQL_USER:-konnekt}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-konnekt}
      MONGODB_URI: mongodb://mongodb:27017/${MONGODB_DATABASE:-konnekt}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-konnekt}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:9000}
    ports:
      - "${API_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: /api
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  mongo-data:

